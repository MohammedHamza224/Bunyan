version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: contractorflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contractorflow
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: contractorflow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractorflow -d contractorflow_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
